[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-eta-ml"
version = "1.0.0"
description = "Delivery ETA ML — avaliação reproduzível com dados sintéticos"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
delivery-eta-ml = "eta_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
